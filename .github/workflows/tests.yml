name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent duplicate and obsolete CI runs for the same change.
# Feature branches are tested through PRs; main is tested after merge.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} — unit and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      # Pinned release revisions; both actions use maintained Node 24 runtime.
      - name: Checkout repository with full audit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q src tests scripts
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Secret screening of current files and all reachable history
        run: python scripts/audit_public_release.py --history
      - name: Rehearse standalone clean-history public snapshot (no publishing)
        if: matrix.python-version == '3.11'
        env:
          EXPORT_DIR: ${{ runner.temp }}/rsm-public-clean
        run: |
          bash scripts/export_public_snapshot.sh "$EXPORT_DIR"
          test "$(git -C "$EXPORT_DIR" rev-list --count HEAD)" = 1
          test -z "$(git -C "$EXPORT_DIR" remote)"
          (
            cd "$EXPORT_DIR"
            python scripts/audit_public_release.py --history --public-history
          )

  lifecycle-simulation:
    name: Isolated WHM lifecycle simulation (no production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build disposable mock WHM image
        run: docker build --pull -t rsm-lifecycle-test -f tests/lifecycle/Dockerfile tests/lifecycle
      - name: Verify install, upgrade, rollback, failed upgrade and uninstall
        run: docker run --rm --network none --security-opt no-new-privileges -v "$PWD:/source:ro" rsm-lifecycle-test
